services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/videos
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,https
    volumes:
      - n8n_data:/home/node/.n8n
      - ${VIDEOS_DIR:-./examples}:/data/videos

volumes:
  n8n_data:
